name: Complete CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de repository op
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Stel Node.js in
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installeer dependencies
      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm test -- --coverage --coverageReporters=cobertura --coverageReporters=text

      - name: Inspect coverage report
        run: |
          echo "Bestanden in coverage:"
          ls -lah coverage/
          echo "Eerste regels van het Cobertura-bestand:"
          head -n 40 coverage/cobertura-coverage.xml
          echo "Zoeken naar package-elementen:"
          grep -n "<package" coverage/cobertura-coverage.xml || true

      # 7. Bouw de applicatie
      - name: Build application
        run: npm run build --if-present
