name: Complete CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de repository op
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Stel Node.js in
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installeer dependencies
      - name: Install dependencies
        run: npm install

      # 4. Voer tests uit en genereer coverage
      - name: Run unit tests with coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=cobertura

      # 5. Controleer of het coverage-bestand bestaat
      - name: Verify coverage report
        run: ls -lah coverage/

      # 6. Genereer een coverage-samenvatting
      - name: Code coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          output: both

      # 7. Bouw de applicatie
      - name: Build application
        run: npm run build --if-present
