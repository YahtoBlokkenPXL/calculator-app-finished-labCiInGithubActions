name: Complete CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de repository op
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Stel Node.js in
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installeer dependencies
      - name: Install dependencies
        run: npm install

      
      - name: Run unit tests with coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=json-summary --coverageReporters=html

      - name: Generate Code Coverage Report
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');

          const report = JSON.parse(
            fs.readFileSync('coverage/coverage-summary.json', 'utf8')
          );

          const files = Object.entries(report)
            .filter(([name]) => name !== 'total');

          const metrics = ['statements', 'branches', 'functions', 'lines'];

          function row(name, data) {
            const values = metrics.map(metric => {
              const value = data[metric];
              return `${value.pct.toFixed(2)}%`;
            });

            return `| ${name} | ${values.join(' | ')} |`;
          }

          let markdown = `## Code Coverage Report 📊

          Here are the details about the code coverage for the latest commit.

          | File | Statements | Branches | Functions | Lines |
          |---|---:|---:|---:|---:|
          `;

          for (const [name, data] of files) {
            markdown += row(name.split('/').pop(), data) + '\n';
          }

          markdown += row('**All Files**', report.total) + '\n';

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          NODE

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          retention-days: 7


      # 7. Bouw de applicatie
      - name: Build application
        run: npm run build --if-present
